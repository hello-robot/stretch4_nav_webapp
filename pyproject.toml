[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-robot-stretch4-nav-webapp"
version = "0.1.0"
description = "Stretch mapping, map editing, and navigation web UI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pillow>=10.0",
]

[project.scripts]
stretch4-nav-webapp = "stretch4_nav_webapp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stretch4_nav_webapp*"]

# The config and the built UI live inside the package.
[tool.setuptools.package-data]
stretch4_nav_webapp = ["config/*.yaml", "static/**/*"]
